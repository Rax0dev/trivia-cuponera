<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="80" fill="#fce7f3"/>
  
  <!-- Cuerpo de la bóveda -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="url(#vaultGradient)" stroke="#be185d" stroke-width="12"/>
  
  <!-- Puerta circular -->
  <circle cx="256" cy="256" r="120" fill="url(#doorGradient)" stroke="#7e22ce" stroke-width="8"/>
  
  <!-- Cerradura central -->
  <circle cx="256" cy="256" r="40" fill="#fce7f3" stroke="#be185d" stroke-width="6"/>
  
  <!-- Manija de la cerradura -->
  <rect x="248" y="220" width="16" height="72" rx="8" fill="#be185d"/>
  <rect x="220" y="248" width="72" height="16" rx="8" fill="#be185d"/>
  
  <!-- Bisagras decorativas -->
  <circle cx="140" cy="140" r="16" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
  <circle cx="372" cy="140" r="16" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
  <circle cx="140" cy="372" r="16" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
  <circle cx="372" cy="372" r="16" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
  
  <!-- Brillo cartoon -->
  <ellipse cx="180" cy="180" rx="30" ry="20" fill="#fce7f3" opacity="0.6" transform="rotate(-45 180 180)"/>
</svg>
